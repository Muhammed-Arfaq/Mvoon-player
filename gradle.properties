org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where Mvoon's complete source code is public. The GPL-3.0 (FFmpeg decoders) requires this link
# to work for everyone who gets the app; it is shown in Settings > About and in the store listing.
mvoon.sourceUrl=https://github.com/mvoon/mvoon
# Privacy policy (Google Play asks for this link too).
mvoon.privacyUrl=https://github.com/mvoon/mvoon/blob/main/PRIVACY.md
